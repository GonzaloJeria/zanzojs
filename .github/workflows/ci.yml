name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum supported version; 22 also runs the node:sqlite conformance tests
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter "./packages/*"

      - name: Run tests
        run: pnpm test

  performance:
    name: Performance & cost gates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build --filter "./packages/*"

      - name: Core performance gate (memory, bundle, throughput)
        run: pnpm --filter @zanzojs/core perf

      - name: SQL cost gate (rows written and read, round trips, latency)
        run: pnpm --filter @zanzojs/sql cost

      - name: Legacy Drizzle cost gate (for comparison)
        run: pnpm --filter @zanzojs/drizzle cost
